<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Galeria - Cortinas</title>

    <!-- Tailwind output -->
    <link href="./css/output.css" rel="stylesheet">
    <script src="js/navbar.js" defer></script>
    <!-- lightGallery (bundle já inclui plugin de vídeo) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lightgallery@2.7.1/css/lightgallery-bundle.min.css">
  </head>

  <body class="bg-[#f5f0eb] text-white antialiased">
    <main class="mt-24 mb-16 px-4">
      <div class="max-w-6xl mx-auto">
        <h1 class="text-2xl text-black sm:text-5xl font-semibold text-center mb-8">Galeria de Fotos e Vídeos</h1>
        <!-- botão simples para abrir toda a galeria (opcional) -->
        <div class="text-center">
          <button id="openAll" class="px-6 py-2 rounded-full bg-white text-black font-medium shadow hover:shadow-md transition">Abrir Galeria</button>
          <button data-category="todas" class="filter-btn px-4 py-2 rounded-full bg-white text-black font-medium shadow hover:shadow-md transition">Todas</button>
          <div class="flex flex-wrap justify-center gap-4 mt-6">
            <button data-category="persianas" class="filter-btn px-4 py-2 rounded-full bg-white text-black font-medium shadow hover:shadow-md transition">Persianas</button>
            <button data-category="cortinas" class="filter-btn px-4 py-2 rounded-full bg-white text-black font-medium shadow hover:shadow-md transition">Cortinas</button>
            <button data-category="tapecarias" class="filter-btn px-4 py-2 rounded-full bg-white text-black font-medium shadow hover:shadow-md transition">Tapeçarias</button>
            <button data-category="almofadas" class="filter-btn px-4 py-2 rounded-full bg-white text-black font-medium shadow hover:shadow-md transition">Almofadas Decorativas</button>
          </div>
        </div>

        <!-- gallery grid container -->
        <div id="galleryGrid" class="grid grid-cols-2 mt-8 sm:grid-cols-3 md:grid-cols-4 gap-4 justify-center items-start">
          <!-- itens serão gerados por JS -->
        </div>
      </div>
    </main>

    <div id="header"></div>
    <div id="footer"></div>

    <!-- lightGallery script -->
    <script src="https://cdn.jsdelivr.net/npm/lightgallery@2.7.1/lightgallery.umd.min.js"></script>

    <script>
      // Lista centralizada de itens (adicione aqui para expandir a galeria)
      // type: 'image' | 'video'
      // src: caminho do recurso (imagem ou vídeo)
      // thumb: miniatura (pode ser a mesma imagem)
      // alt: texto alternativo para acessibilidade
      const galleryItems = [
        //ALMOFADAS
        { type: 'image', src: 'img/almofadas-decorativas/almofada2.jpg', thumb: 'img/almofadas-decorativas/almofada2.jpg', alt: 'Almofadas', category: 'almofadas' },
        { type: 'image', src: 'img/almofadas-decorativas/almofadas1.jpg', thumb: 'img/almofadas-decorativas/almofadas1.jpg', alt: 'Almofadas', category: 'almofadas' },
        { type: 'image', src: 'img/almofadas-decorativas/almofada3.webp', thumb: 'img/almofadas-decorativas/almofada3.webp', alt: 'Almofadas', category: 'almofadas' },
        
        //PERSIANAS
        { type: 'image', src: 'img/persianas/double-vision.jpg', thumb: 'img/persianas/double-vision.jpg', alt: 'Double Vision', category: 'persianas' },
        { type: 'image', src: 'img/persianas/horizontal.webp', thumb: 'img/persianas/horizontal.webp', alt: 'Horizontal', category: 'persianas' },
        { type: 'image', src: 'img/persianas/madeira.webp', thumb: 'img/persianas/madeira.webp', alt: 'Madeira', category: 'persianas' },
        { type: 'image', src: 'img/persianas/rolo-blackout.webp', thumb: 'img/persianas/rolo-blackout.webp', alt: 'Rolô Blackout', category: 'persianas' },
        { type: 'image', src: 'img/persianas/romana.jpg', thumb: 'img/persianas/romana.jpg', alt: 'Romana', category: 'persianas' },
        { type: 'image', src: 'img/persianas/vertical.jpg', thumb: 'img/persianas/vertical.jpg', alt: 'Vertical', category: 'persianas' },
        { type: 'image', src: 'img/persianas/rolo-tela-solar.jpg', thumb: 'img/persianas/rolo-tela-solar.jpg', alt: 'Rolô Tela Solar', category: 'persianas' },
        { type: 'video', src: 'img/persianas/rolo-tela-solar.mp4', thumb: 'img/persianas/rolo-tela-solar.jpg', alt: 'Rolô Tela Solar', category: 'persianas' },

        //TAPECARIAS
        { type: 'image', src: 'img/tapecarias/tapecaria1.jpg', thumb: 'img/tapecarias/tapecaria1.jpg', alt: 'Tapeçaria', category: 'tapecarias' },
        { type: 'image', src: 'img/tapecarias/tapecaria2.webp', thumb: 'img/tapecarias/tapecaria2.webp', alt: 'Tapeçaria', category: 'tapecarias' },
        { type: 'image', src: 'img/tapecarias/tapecaria3.jpg', thumb: 'img/tapecarias/tapecaria3.jpg', alt: 'Tapeçaria', category: 'tapecarias' },
        { type: 'image', src: 'img/tapecarias/tapecaria4.webp', thumb: 'img/tapecarias/tapecaria4.webp', alt: 'Tapeçaria', category: 'tapecarias' },
        
        //CORTINAS
        { type: 'image', src: 'img/cortinas/prega-americana.jpg', thumb: 'img/cortinas/prega-americana.jpg', alt: 'Prega Americana', category: 'cortinas' },
        { type: 'image', src: 'img/cortinas/prega-femea.jpg', thumb: 'img/cortinas/prega-femea.jpg', alt: 'Prega Femea', category: 'cortinas' },
        { type: 'image', src: 'img/cortinas/prega-franzida.jpeg', thumb: 'img/cortinas/prega-franzida.jpeg', alt: 'Prega Franzida', category: 'cortinas' },
        { type: 'image', src: 'img/cortinas/prega-wave-varao.jpg', thumb: 'img/cortinas/prega-wave-varao.jpg', alt: 'Prega Wave Varão', category: 'cortinas' },
        { type: 'image', src: 'img/cortinas/prega-wave.jpg', thumb: 'img/cortinas/prega-wave.jpg', alt: 'Prega Wave', category: 'cortinas' },
        { type: 'image', src: 'img/cortinas/romana.jpg', thumb: 'img/cortinas/romana.jpg', alt: 'Romana', category: 'cortinas' },
      ];

      // variável para manter a instância do lightGallery
      let lgInstance = null;

      // cria um item da galeria no DOM (sem necessidade de duplicar markup manualmente)
      function createGalleryItem(item) {
        const a = document.createElement('a');
        a.className = 'block overflow-hidden rounded-lg shadow-sm bg-white';
        a.href = item.src;
        a.setAttribute('aria-label', item.alt || '');
        a.setAttribute('data-lg-size', '1280-720');

        if (item.type === 'video') {
          // data attribute para lightgallery vídeo (JSON)
          a.setAttribute('data-lg-video', JSON.stringify({
            source: [{ src: item.src, type: 'video/mp4' }],
            attributes: { preload: false, controls: true }
          }));
        }

        const img = document.createElement('img');
        img.loading = 'lazy';
        img.decoding = 'async';
        img.className = 'w-full h-40 object-cover sm:h-44 md:h-36 lg:h-44';
        img.src = item.thumb || item.src;
        img.alt = item.alt || '';

        a.appendChild(img);
        return a;
      }

      // função para (re)inicializar o lightGallery no grid atual
      function initLightGalleryOn(grid) {
        if (lgInstance) {
          try { lgInstance.destroy(); } catch (e) { /* ignore */ }
          lgInstance = null;
        }
        lgInstance = lightGallery(grid, {
          selector: 'a',
          speed: 400,
          download: false,
          autoplayFirstVideo: false,
        });
      }

      // Filtro por categoria
      document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const selected = btn.getAttribute('data-category');
          const grid = document.getElementById('galleryGrid');
          grid.innerHTML = ''; // limpa galeria

          const filtered = selected === 'todas'
            ? galleryItems
            : galleryItems.filter(item => item.category === selected);

          filtered.forEach(it => grid.appendChild(createGalleryItem(it)));

          // reinicializa o lightGallery para que os novos <a> sejam reconhecidos
          initLightGalleryOn(grid);
        });
      });

      // renderiza a grade e inicializa o lightGallery
      (function initGallery() {
        const grid = document.getElementById('galleryGrid');
        if (!grid) return;

        // cria dinamicamente os itens
        galleryItems.forEach(it => grid.appendChild(createGalleryItem(it)));

        // inicializa lightGallery no container (seleciona <a>)
        initLightGalleryOn(grid);

        // botão "Abrir Galeria" abre o primeiro item
        const openAll = document.getElementById('openAll');
        if (openAll) {
          openAll.addEventListener('click', () => {
            if (lgInstance) lgInstance.openGallery(0);
          });
        }
      })();

    </script>

    <!-- incluir showHeader&Footer.js para injetar header/footer -->
    <script src="js/showHeader&Footer.js" defer></script>
  </body>
</html>
